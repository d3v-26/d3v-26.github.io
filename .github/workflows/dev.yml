name: Deploy Development Preview

on:
  push:
    branches: ["development"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "dev-pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-dev-${{ hashFiles('**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-dev-${{ hashFiles('**/yarn.lock') }}-

      - name: Install dependencies
        run: yarn install

      - name: Build with Next.js (dev preview at /dev)
        run: yarn build
        env:
          NEXT_BASE_PATH: /dev

      - name: Add .nojekyll
        run: touch ./out/.nojekyll

      - name: Deploy to gh-pages (dev subfolder)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: out
          target-folder: dev
          clean: true

      - name: Ensure .nojekyll at gh-pages root
        run: mkdir -p /tmp/root-nojekyll && touch /tmp/root-nojekyll/.nojekyll

      - name: Deploy .nojekyll to gh-pages root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: /tmp/root-nojekyll
          clean: false
